name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sqlite:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: python -m pytest -q

  mysql:
    runs-on: ubuntu-latest
    container: python:3.12-bookworm
    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: memoir-ci-only
          MYSQL_ROOT_HOST: '%'
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pmemoir-ci-only"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      MEMOIR_TEST_MYSQL_ADMIN_URL: mysql+pymysql://root:memoir-ci-only@mysql:3306/mysql?charset=utf8mb4
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update && apt-get install -y --no-install-recommends default-mysql-client
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q tests/test_mysql.py

  frontend:
    runs-on: ubuntu-latest
    needs: [sqlite, mysql]
    env:
      UI_BROWSER_CHANNEL: chromium
      UI_SCREENSHOTS: ui-artifacts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install -r requirements-dev.txt
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: python tools/frontend.py bootstrap
      - run: python tools/frontend.py check
      - run: python tools/run_ui.py
      - run: VOICE_UI=1 UI_CHECK_SCRIPT=tests/family-voice-checks.cjs python tools/run_ui.py
      - name: Package verified release
        run: |
          python tools/frontend.py release --version "${GITHUB_SHA}" --output "dist/memoir-${GITHUB_SHA}.tar.gz"
          cd dist
          sha256sum *.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-screenshots
          path: ui-artifacts/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: memoir-release
          path: dist/
