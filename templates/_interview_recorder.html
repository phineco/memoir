<section id="interview-recorder" class="disclosure" data-user="{{ recorder_user }}" data-owner="{{ local_identity.owner }}" data-key="{{ local_identity.key }}" data-session="{{ interview.id }}" data-revision="{{ interview.revision }}" data-upload="{{ url_for('interview.upload',family_id=family.id,session_id=interview.id) }}" data-identity="{{ url_for('interview.identity') }}" data-csrf="{{ csrf_token() }}">
<h3>也可以录音回答</h3><label class="check"><input id="recording-consent" type="checkbox">本人同意或已告知讲述者，允许本段录音在本站私有保存。录音不用于声音复刻。</label>
<p class="hint">单次最长3分钟，可接着分段讲。停止后先封存本机，再上传；强杀或清理浏览器数据可能丢失尚未保存的片段。</p>
<div class="form-actions"><button class="btn-primary" type="button" id="record-start">开始回答</button><button class="btn-secondary" type="button" id="record-stop" disabled>说完了</button></div>
<p id="record-status" role="status" aria-live="polite">录音尚未开始，也可以在下方填写文字。</p><audio id="record-playback" controls preload="none" class="full"></audio><div id="record-pending"></div>
<details><summary>从手机上传录音文件</summary><form method="post" enctype="multipart/form-data" action="{{ url_for('interview.upload',family_id=family.id,session_id=interview.id) }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input type="hidden" name="revision" value="{{ interview.revision }}"><input type="hidden" name="nonce" value="{{ nonce }}"><label>录音文件（最多16 MiB、3分钟）<input type="file" class="full" name="audio" accept="audio/*" required></label><label class="check"><input type="checkbox" name="consent_recording" value="yes" required>确认本人同意或已告知讲述者，允许本站私有保存</label><button class="btn-secondary" type="submit">上传录音</button></form></details>
</section>
