<section id="interview-recorder" class="disclosure" data-user="{{ recorder_user }}" data-notice="{{ privacy_version }}" data-owner="{{ local_identity.owner }}" data-key="{{ local_identity.key }}" data-session="{{ interview.id }}" data-revision="{{ interview.revision }}" data-upload="{{ url_for('interview.upload',family_id=family.id,session_id=interview.id) }}" data-identity="{{ url_for('interview.identity') }}" data-csrf="{{ csrf_token() }}">
<h3>也可以录音回答</h3><details id="recording-notice" open><summary id="recording-notice-summary">录音与转写选择（先确认）</summary><label class="check"><input id="recording-consent" type="checkbox">{% if interview.recording_mode=='self' %}本次采访，我同意录音仅供本站私有保存，不用于复刻。{% else %}本次采访，已向讲述者说明并取得同意，允许录音私有保存，不用于复刻。{% endif %}</label>
{% if asr_enabled %}<label class="check"><input id="recording-asr-consent" type="checkbox">{% if interview.recording_mode=='self' %}我同意本次录音交阿里云转写，完成后继续。{% else %}已取得讲述者同意，将本次录音交阿里云转写，完成后继续。{% endif %}</label>{% else %}<p class="hint">阿里云转写暂未开通，录音可先私有保存和回听，回答可手动填写。</p>{% endif %}
<p class="hint">本设备可沿用本次采访已确认的选项，可取消勾选停止后续沿用；已发出的处理可能产生用量。</p><p class="hint">单次最长3分钟，可接着分段讲。停止后先封存本机，再上传；强杀或清理浏览器数据可能丢失尚未保存的片段。</p>
</details><div class="form-actions"><button class="btn-primary" type="button" id="record-start">开始回答</button><button class="btn-secondary" type="button" id="record-stop" disabled>说完了</button></div>
<p id="record-status" role="status" aria-live="polite">录音尚未开始，也可以在下方填写文字。</p><audio id="record-playback" controls preload="none" class="full"></audio><div id="record-pending"></div>
<details><summary>从手机上传录音文件</summary><form method="post" enctype="multipart/form-data" action="{{ url_for('interview.upload',family_id=family.id,session_id=interview.id) }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input type="hidden" name="revision" value="{{ interview.revision }}"><input type="hidden" name="nonce" value="{{ nonce }}"><label>录音文件（最多16 MiB、3分钟）<input type="file" class="full" name="audio" accept="audio/*" required></label><label class="check"><input type="checkbox" name="consent_recording" value="yes" required>确认已取得讲述者同意，允许本站私有保存</label>{% if asr_enabled %}<label class="check"><input type="checkbox" name="consent_asr" value="yes">同意将本段录音交给阿里云转写</label>{% endif %}<button class="btn-secondary" type="submit">上传录音</button></form></details>
</section>
