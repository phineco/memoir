<fieldset class="reading-controls"><legend>阅读字号</legend><div class="form-actions">{% for size,label in [('18','标准'),('22','大字'),('26','特大')] %}<button type="button" class="btn-small btn-secondary" data-reading-size="{{ size }}" aria-pressed="false">{{ label }}</button>{% endfor %}<a href="{{ url_for('main.display_preferences',family_id=family.id) }}">字体与外观</a></div><p class="hint" data-display-status role="status" aria-live="polite"></p></fieldset>
