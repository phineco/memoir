<details><summary>从手机上传录音文件</summary><form id="record-file-form" method="post" enctype="multipart/form-data" action="{{ url_for('interview.upload',family_id=family.id,session_id=interview.id) }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input type="hidden" name="revision" value="{{ interview.revision }}"><input type="hidden" name="nonce" value="{{ nonce }}"><label>录音文件（最多16 MiB、3分钟）<input type="file" class="full" name="audio" accept="audio/*" required></label><label class="check"><input type="checkbox" name="consent_recording" value="yes" required>确认已取得讲述者同意，允许本站私有保存</label>{% if asr_enabled %}<label class="check"><input type="checkbox" name="consent_asr" value="yes">同意将本段录音交给阿里云转写</label>{% endif %}<button class="btn-secondary" type="submit">上传录音</button></form></details>
