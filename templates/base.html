<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}家音 · 回忆录{% endblock %}</title>
<script src="{{ asset_url('preferences.js') }}"></script>
<link rel="stylesheet" href="{{ asset_url('app.css') }}">
</head>
<body data-user-id="{{ me.id if me else '' }}" data-family-id="{{ family.id if family else '' }}" {% if request.endpoint == 'main.index' and me %}data-family-picker{% endif %}>
<a class="skip-link" href="#main-content">跳到正文</a>
<header class="topbar">
<div class="topbar-inner">
  <a class="brand" href="{{ url_for('main.index', switch=1) }}"><span class="brand-mark" aria-hidden="true">家</span> 家音</a>
  <button type="button" id="site-menu-toggle" class="btn-secondary" aria-controls="site-menu" aria-expanded="false" hidden>菜单</button>
  <div class="topright" id="site-menu">
    {% block nav %}{% endblock %}
    <span class="auth">
    <a href="{{ url_for('main.guide', family_id=family.id if family else None) }}">帮助</a>
    {% if me %}
      <a href="{{ url_for('main.account', family_id=family.id if family else None) }}" aria-label="个人中心：{{ me.nickname }}">👤 {{ me.nickname }}</a> <a href="{{ url_for('main.logout') }}">退出</a>
    {% else %}
      <a href="{{ url_for('main.login') }}">登录</a> <a href="{{ url_for('main.register') }}">注册</a>
    {% endif %}
    </span>
  </div>
</div>
</header>
<main class="container" id="main-content" tabindex="-1">
{% block content %}{% endblock %}
</main>
<footer class="footer"><nav class="footer-links" aria-label="服务条款">
<a href="{{ url_for('main.terms',family_id=family.id if family else None) }}">用户服务协议</a>
<a href="{{ url_for('main.privacy',family_id=family.id if family else None) }}">隐私政策</a>
</nav><span>© 2026 安徽锡拉科技有限公司</span> · <a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener noreferrer">皖ICP备17001829号-1</a></footer>
<script src="{{ asset_url('navigation.js') }}"></script>
<script src="{{ asset_url('read-aloud.js') }}"></script>
<script src="{{ asset_url('family-context.js') }}"></script>
{% block script %}{% endblock %}
</body>
</html>
