<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}家音 · 回忆录{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='tailwind.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='ui.css') }}">
</head>
<body>
<header class="topbar">
<div class="topbar-inner">
  <a class="brand" href="{{ url_for('main.index') }}">🏠 家音 · 回忆录</a>
  <div class="topright">
    {% block nav %}{% endblock %}
    <span class="auth">
    <a href="{{ url_for('main.guide') }}">📖 指南</a>
    {% if me %}
      👤 {{ me.nickname }} <a href="{{ url_for('main.logout') }}">退出</a>
    {% else %}
      <a href="{{ url_for('main.login') }}">登录</a> <a href="{{ url_for('main.register') }}">注册</a>
    {% endif %}
    </span>
  </div>
</div>
</header>
<main class="container">
{% block content %}{% endblock %}
</main>
<footer class="footer"><span>© 2026 安徽锡拉科技有限公司</span> · <a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener noreferrer">皖ICP备17001829号-1</a></footer>
<script src="{{ url_for('static', filename='read-aloud.js') }}"></script>
{% block script %}{% endblock %}
</body>
</html>
