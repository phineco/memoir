{% extends "base.html" %}
{% block title %}编辑小传 - {{ person.name }}{% endblock %}
{% block content %}
<div class="nav"><a href="{{ url_for('main.person_page', family_id=family.id, person_id=person.id) }}">← 返回人物页</a></div>
<h2>✏️ 编辑人物小传</h2>
<p class="hint">小传由 skill 自动提炼生成；管理员手动修订会保存为新版本（当前第 {{ version }} 版），历史版本保留。</p>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form method="post">
  <label>小传正文<br>
    <textarea name="profile_text" rows="14" class="full" required>{{ text }}</textarea>
  </label>
  <div class="form-actions">
    <button type="submit" class="btn-primary">保存为新版本</button>
  </div>
</form>
{% endblock %}
