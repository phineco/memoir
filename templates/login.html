{% extends "easy_base.html" if easy_mode else "base.html" %}
{% block title %}登录 · 家音{% endblock %}
{% block content %}
<h1>登录</h1>
{% set selected_mode = login_mode|default('sms', true) %}
<div class="login-methods" role="group" aria-label="选择登录方式">
<button type="button" id="tab-sms" class="{{ 'btn-primary' if selected_mode == 'sms' else 'btn-secondary' }}" aria-pressed="{{ 'true' if selected_mode == 'sms' else 'false' }}" aria-controls="form-sms" onclick="switchMode('sms')">验证码登录</button>
<button type="button" id="tab-pw" class="{{ 'btn-primary' if selected_mode == 'password' else 'btn-secondary' }}" aria-pressed="{{ 'true' if selected_mode == 'password' else 'false' }}" aria-controls="form-pw" onclick="switchMode('password')">密码登录</button>
</div>
<form method="post" class="authform" id="form-pw"{% if selected_mode != 'password' %} hidden{% endif %}>
<input type="hidden" name="login_mode" value="password">
<input name="phone" placeholder="手机号 / 用户名" required autocomplete="username" aria-label="手机号 / 用户名">
<div class="coderow">
<input type="password" name="password" id="login-pw" autocomplete="current-password" placeholder="密码" required style="flex:1" aria-label="密码">
<button type="button" class="btn-small" onclick="var i=document.getElementById('login-pw');i.type=i.type==='password'?'text':'password';this.textContent=i.type==='password'?'👁️':'🙈';" title="显示/隐藏密码">👁️</button>
</div>
<button type="submit">登录</button>
</form>
<form method="post" class="authform" id="form-sms"{% if selected_mode != 'sms' %} hidden{% endif %}>
<input type="hidden" name="login_mode" value="sms">
<input type="tel" name="phone" id="sms-phone" inputmode="numeric" autocomplete="tel" maxlength="11" placeholder="手机号" required pattern="\d{11}" aria-label="手机号">
<div class="coderow">
<input name="code" inputmode="numeric" autocomplete="one-time-code" placeholder="短信验证码" required style="flex:1" aria-label="短信验证码">
<button type="button" id="sendLoginCode" class="btn-small">获取验证码</button>
</div>
<button type="submit">登录</button>
</form>
{% if error %}<p class="error">{{ error}}</p>{% endif %}
<p class="hint">没有账号？<a href="{{ url_for('main.register', next=request.args.get('next'))}}">去注册</a> · <a href="{{ url_for('main.forgot_password')}}">忘记密码</a></p>
<p class="hint">可随时查阅<a href="{{ url_for('main.terms') }}">用户服务协议</a>和<a href="{{ url_for('main.privacy') }}">隐私政策</a>。</p>
<script>
function switchMode(m){
var password = m === 'password';
document.getElementById('form-pw').hidden = !password;
document.getElementById('form-sms').hidden = password;
[['tab-pw', password], ['tab-sms', !password]].forEach(function(item){
var button = document.getElementById(item[0]);
button.className = item[1] ? 'btn-primary' : 'btn-secondary';
button.setAttribute('aria-pressed', item[1] ? 'true' : 'false');
});
}
document.getElementById('sendLoginCode').onclick = function(){
var phone = document.getElementById('sms-phone').value.trim();
var btn = this;
fetch('{{ url_for("main.api_sms_code")}}', {method:'POST',
headers:{'Content-Type':'application/json'},
body: JSON.stringify({phone: phone, purpose: 'login'})})
.then(function(r){ return r.json();})
.then(function(d){
if(d.ok){ alert(d.dev_mode? ('验证码：'+d.dev_code): '验证码已发送'); countdown(btn);}
else alert(d.error||'发送失败');
}).catch(function(){ alert('发送失败');});
};
function countdown(btn){
var s = 60; btn.disabled = true;
var t = setInterval(function(){ s--; btn.textContent = s+'s';
if(s<=0){ clearInterval(t); btn.disabled=false; btn.textContent='获取验证码';}}, 1000);
}
</script>
{% endblock %}
