<!doctype html><html lang="zh-CN" data-easy="1"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}家音简易版{% endblock %}</title><script src="{{ asset_url('preferences.js') }}"></script><link rel="stylesheet" href="{{ asset_url('app.css') }}"></head>
<body class="easy-body" data-user-id="{{ me.id if me else '' }}" data-family-id="{{ family.id if family else '' }}"><a class="skip-link" href="#main-content">跳到正文</a><header class="easy-header"><a class="btn-secondary" href="{{ url_for('easy.index',family_id=family.id if family else none) }}">家音</a><span>{{ family.name if family else '选择家庭' }}</span><a class="btn-secondary" href="{{ url_for('main.account',family_id=family.id if family else none) }}">设置</a></header>
<main class="container easy-main" id="main-content" tabindex="-1">{% block content %}{% endblock %}</main>
<nav class="easy-nav" aria-label="简易版主导航"><a href="{{ url_for('easy.tell',family_id=family.id if family else none) }}">讲故事</a><a href="{{ url_for('easy.records',family_id=family.id if family else none) }}">我的记录</a><a href="{{ url_for('main.stories',family_id=family.id if family else none) if family else url_for('easy.index') }}">听故事</a></nav>
<script src="{{ asset_url('read-aloud.js') }}"></script>{% block script %}{% endblock %}</body></html>
