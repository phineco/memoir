{% extends 'easy_base.html' %}{% block content %}<div class="page-heading"><h1>今天，讲一段回忆</h1><p>一次一个问题。讲完可以休息，下次继续。</p></div><div class="easy-actions">{% if continuing %}<a class="btn-primary" href="{{ url_for('interview.detail',family_id=family.id,session_id=continuing.id) }}">继续上次讲述</a>{% else %}<a class="btn-primary" href="{{ url_for('easy.tell',family_id=family.id) }}">开始讲故事</a>{% endif %}<a class="btn-secondary" href="{{ url_for('easy.records',family_id=family.id) }}">我的记录</a><a class="btn-secondary" href="{{ url_for('main.stories',family_id=family.id) }}">听家人的故事</a></div><p class="hint">录音和回答先只给您自己看。核对成稿后，再决定分享给谁。</p><details class="disclosure"><summary>换个家庭</summary>{% for f in site_navigation(family).families %}<a class="btn-secondary" href="{{ url_for('easy.index',family_id=f.id) }}">{{ f.name }}</a>{% endfor %}</details>{% endblock %}
