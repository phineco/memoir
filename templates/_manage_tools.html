<div class="management-section-heading"><h2>家庭资料工具</h2><p class="hint">管理对外分享，或导入已整理的家庭资料。</p></div>
<div class="management-tools">
  {% for title,description,endpoint,label in [
    ('分享管理','管理已发布的对外分享。分享快照可供家庭外的人阅读。','main.share_list','管理分享'),
    ('同步入库','把整理好的家庭资料导入，查看同步记录与结果。','main.sync_import','同步入库')
  ] %}
  <section class="card management-tool"><h3>{{ title }}</h3><p class="hint">{{ description }}</p><div class="form-actions"><a class="btn-secondary" href="{{ url_for(endpoint,family_id=family.id) }}">{{ label }}</a></div></section>
  {% endfor %}
</div>
